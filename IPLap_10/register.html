<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Job Portal - Registration</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
}

header {
    background-color: #2d6cdf;
    color: white;
    padding: 15px 50px;
}

header h2 {
    display: inline;
}

nav {
    float: right;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
}

nav a:hover {
    text-decoration: underline;
}

.container {
    width: 650px;
    margin: 40px auto;
    background-color: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #2d6cdf;
}

.row {
    display: flex;
    gap: 20px;
}

.field {
    flex: 1;
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select,
textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
}

textarea {
    height: 80px;
    resize: none;
}

.error {
    color: red;
    font-size: 13px;
    margin-top: 4px;
}

.terms {
    margin-top: 10px;
}

.terms input {
    width: auto;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background-color: #2d6cdf;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #173b7a;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

</style>

</head>

<body>

<header>

<h2>Job Portal</h2>

<nav>

<a href="Homee.html">
Home
</a>

<a href="Homee.html#jobs">
Jobs
</a>

<a href="Homee.html#about">
About
</a>

<a href="register.html">
Register
</a>

</nav>

</header>


<div class="container">

<h1>
Job Seeker Registration
</h1>


<!-- FORM -->

<form id="jobForm"
      action="register.jsp"
      method="post">


<!-- FIRST NAME AND LAST NAME -->

<div class="row">

<div class="field">

<label>First Name *</label>

<input
type="text"
id="firstName"
name="firstName"
placeholder="Enter first name">

<div
class="error"
id="firstNameError">
</div>

</div>


<div class="field">

<label>Last Name *</label>

<input
type="text"
id="lastName"
name="lastName"
placeholder="Enter last name">

<div
class="error"
id="lastNameError">
</div>

</div>

</div>


<!-- EMAIL AND PHONE -->

<div class="row">

<div class="field">

<label>Email *</label>

<input
type="text"
id="email"
name="email"
placeholder="example@gmail.com">

<div
class="error"
id="emailError">
</div>

</div>


<div class="field">

<label>Phone Number *</label>

<input
type="text"
id="phone"
name="phone"
placeholder="10 digit number">

<div
class="error"
id="phoneError">
</div>

</div>

</div>


<!-- QUALIFICATION -->

<div class="field">

<label>Qualification *</label>

<select
id="qualification"
name="qualification">

<option value="">
Select Qualification
</option>

<option value="Diploma">
Diploma
</option>

<option value="Undergraduate">
Undergraduate
</option>

<option value="Postgraduate">
Postgraduate
</option>

</select>

<div
class="error"
id="qualificationError">
</div>

</div>


<!-- JOB CATEGORY -->

<div class="field">

<label>Preferred Job Category *</label>

<select
id="jobCategory"
name="jobCategory">

<option value="">
Select Job Category
</option>

<option value="Software Development">
Software Development
</option>

<option value="Web Development">
Web Development
</option>

<option value="Data Science">
Data Science
</option>

<option value="UI/UX Design">
UI/UX Design
</option>

<option value="DevOps Engineer">
DevOps Engineer
</option>

<option value="Cloud Engineer">
Cloud Engineer
</option>

</select>

<div
class="error"
id="jobCategoryError">
</div>

</div>


<!-- SKILLS -->

<div class="field">

<label>Skills *</label>

<input
type="text"
id="skills"
name="skills"
placeholder="Example: Python, Java, HTML">

<div
class="error"
id="skillsError">
</div>

</div>


<!-- LINKEDIN -->

<div class="field">

<label>LinkedIn Profile *</label>

<input
type="text"
id="linkedin"
name="linkedin"
placeholder="https://www.linkedin.com/in/yourname">

<div
class="error"
id="linkedinError">
</div>

</div>


<!-- LOCATION -->

<div class="field">

<label>Preferred Job Location *</label>

<input
type="text"
id="location"
name="location"
placeholder="Enter preferred location">

<div
class="error"
id="locationError">
</div>

</div>


<!-- ABOUT -->

<div class="field">

<label>About Yourself</label>

<textarea
id="about"
name="about"
placeholder="Write something about yourself"></textarea>

</div>


<!-- PASSWORD -->

<div class="row">

<div class="field">

<label>Password *</label>

<input
type="password"
id="password"
name="password"
placeholder="Enter password">

<div
class="error"
id="passwordError">
</div>

</div>


<!-- CONFIRM PASSWORD -->

<div class="field">

<label>Confirm Password *</label>

<input
type="password"
id="confirmPassword"
name="confirmPassword"
placeholder="Confirm password">

<div
class="error"
id="confirmPasswordError">
</div>

</div>

</div>


<!-- TERMS -->

<div class="terms">

<input
type="checkbox"
id="terms"
name="terms"
value="accepted">

I agree to the Terms and Conditions.

<div
class="error"
id="termsError">
</div>

</div>


<!-- REGISTER BUTTON -->

<button type="submit">
Register
</button>

<div id="message"></div>

</form>

</div>


<script>

document
.getElementById("jobForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    let valid = true;


    // FIRST NAME

    let firstName =
    document.getElementById("firstName").value.trim();

    if (firstName === "") {

        document.getElementById("firstNameError")
        .textContent =
        "First name is required.";

        valid = false;
    }


    // LAST NAME

    let lastName =
    document.getElementById("lastName").value.trim();

    if (lastName === "") {

        document.getElementById("lastNameError")
        .textContent =
        "Last name is required.";

        valid = false;
    }


    // EMAIL

    let email =
    document.getElementById("email").value.trim();

    let emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email === "") {

        document.getElementById("emailError")
        .textContent =
        "Email is required.";

        valid = false;

    }

    else if (!emailPattern.test(email)) {

        document.getElementById("emailError")
        .textContent =
        "Enter a valid email address.";

        valid = false;
    }


    // PHONE

    let phone =
    document.getElementById("phone").value.trim();

    let phonePattern =
    /^[0-9]{10}$/;

    if (phone === "") {

        document.getElementById("phoneError")
        .textContent =
        "Phone number is required.";

        valid = false;

    }

    else if (!phonePattern.test(phone)) {

        document.getElementById("phoneError")
        .textContent =
        "Enter a valid 10 digit phone number.";

        valid = false;
    }


    // QUALIFICATION

    let qualification =
    document.getElementById("qualification").value;

    if (qualification === "") {

        document.getElementById("qualificationError")
        .textContent =
        "Please select your qualification.";

        valid = false;
    }


    // JOB CATEGORY

    let jobCategory =
    document.getElementById("jobCategory").value;

    if (jobCategory === "") {

        document.getElementById("jobCategoryError")
        .textContent =
        "Please select a job category.";

        valid = false;
    }


    // SKILLS

    let skills =
    document.getElementById("skills").value.trim();

    if (skills === "") {

        document.getElementById("skillsError")
        .textContent =
        "Please enter your skills.";

        valid = false;
    }


    // LINKEDIN

    let linkedin =
    document.getElementById("linkedin").value.trim();

    let linkedinPattern =
    /^https:\/\/(www\.)?linkedin\.com\/in\/.+$/;

    if (linkedin === "") {

        document.getElementById("linkedinError")
        .textContent =
        "LinkedIn profile is required.";

        valid = false;

    }

    else if (!linkedinPattern.test(linkedin)) {

        document.getElementById("linkedinError")
        .textContent =
        "Enter a valid LinkedIn profile URL.";

        valid = false;
    }


    // LOCATION

    let location =
    document.getElementById("location").value.trim();

    if (location === "") {

        document.getElementById("locationError")
        .textContent =
        "Preferred location is required.";

        valid = false;
    }


    // PASSWORD

    let password =
    document.getElementById("password").value;

    if (password === "") {

        document.getElementById("passwordError")
        .textContent =
        "Password is required.";

        valid = false;

    }

    else if (password.length < 6) {

        document.getElementById("passwordError")
        .textContent =
        "Password must contain at least 6 characters.";

        valid = false;
    }


    // CONFIRM PASSWORD

    let confirmPassword =
    document.getElementById("confirmPassword").value;

    if (confirmPassword === "") {

        document.getElementById("confirmPasswordError")
        .textContent =
        "Please confirm your password.";

        valid = false;

    }

    else if (confirmPassword !== password) {

        document.getElementById("confirmPasswordError")
        .textContent =
        "Passwords do not match.";

        valid = false;
    }


    // TERMS

    let terms =
    document.getElementById("terms").checked;

    if (!terms) {

        document.getElementById("termsError")
        .textContent =
        "Please accept the Terms and Conditions.";

        valid = false;
    }


    // SUBMIT TO JSP

    if (valid) {

        document
        .getElementById("jobForm")
        .submit();

    }

});

</script>

</body>
</html>
