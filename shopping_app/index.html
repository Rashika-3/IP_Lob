<!DOCTYPE html>

<html>
<head>

<title>Shopping App - Place Order</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 430px;

        background: white;

        padding: 35px;

        border-radius: 18px;

        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
        text-align: center;
        color: #4f46e5;

        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;

        margin-bottom: 25px;
    }

    label {
        font-weight: bold;
        color: #333;

        display: block;

        margin-bottom: 7px;
    }

    input[type="text"],
    input[type="number"] {

        width: 100%;

        padding: 12px;

        margin-bottom: 18px;

        border: 1px solid #ccc;

        border-radius: 8px;

        font-size: 15px;
    }

    input:focus {

        border-color: #4f46e5;

        outline: none;

        box-shadow: 0 0 5px rgba(79,70,229,0.3);
    }

    input[type="submit"] {

        width: 100%;

        padding: 13px;

        background: #4f46e5;

        color: white;

        border: none;

        border-radius: 8px;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;
    }

    input[type="submit"]:hover {

        background: #3730a3;
    }

</style>


</head>

<body>

<div class="container">


<h1>Shopping App</h1>

<p class="subtitle">Place Your Order</p>

<form action="insert_order.php" method="POST">

    <label>Customer Name</label>

    <input
        type="text"
        name="customer_name"
        placeholder="Enter customer name"
        required
    >

    <label>Product Name</label>

    <input
        type="text"
        name="product_name"
        placeholder="Enter product name"
        required
    >

    <label>Quantity</label>

    <input
        type="number"
        name="quantity"
        min="1"
        placeholder="Enter quantity"
        required
    >

    <label>Price</label>

    <input
        type="number"
        name="price"
        step="0.01"
        min="0"
        placeholder="Enter price"
        required
    >

    <input
        type="submit"
        value="Place Order"
    >

</form>

</div>

</body>
</html>
