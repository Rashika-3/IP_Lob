<!DOCTYPE html>
<html>
<head>
    <title>Session Tracking Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-box {
            width: 420px;
            background: white;

            padding: 40px;
            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px;

            margin-top: 8px;
            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #667eea;
            outline: none;
        }

        input[type="submit"] {
            width: 100%;
            padding: 13px;

            background: #2c3e50;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #1a252f;
        }

        .info {
            margin-top: 25px;
            padding: 15px;

            background: #f4f6f8;
            border-radius: 10px;

            font-size: 13px;
            color: #555;
        }

        .info h3 {
            margin-top: 0;
            color: #2c3e50;
        }

        .methods {
            margin-top: 15px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Session Tracking</h1>

    <p class="subtitle">
        Servlet Session Tracking Demonstration
    </p>

    <form action="SessionTrackingServlet" method="post">

        <label>Username</label>

        <input type="text"
               name="username"
               placeholder="Enter username"
               required>

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter password"
               required>

        <input type="submit"
               value="Login">

    </form>

    

</div>

</body>
</html>
