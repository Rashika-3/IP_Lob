<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Portal - Registration</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
            min-height: 100vh;
        }

        /* Header */

        header {
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            color: white;
            padding: 18px 50px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        header h2 {
            display: inline;
            margin: 0;
        }

        nav {
            float: right;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffd6f6;
        }

        /* Main Container */

        .container {
            width: 700px;
            margin: 45px auto;
            background: rgba(255,255,255,0.96);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(67,34,120,0.25);
        }

        h1 {
            text-align: center;
            color: #6a11cb;
            margin-bottom: 25px;
        }

        /* Two Columns */

        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 5px;
        }

        .column {
            flex: 1;
        }

        /* Labels */

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #4a3b5c;
        }

        /* Input and Select */

        input,
        select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 2px solid #ddd0f5;
            border-radius: 7px;
            background-color: #faf7ff;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        /* Focus */

        input:focus,
        select:focus {
            border-color: #8e2de2;
            box-shadow: 0 0 6px rgba(142,45,226,0.25);
            background-color: white;
        }

        /* Register Button */

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: linear-gradient(90deg, #8e2de2, #ff4ecd);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(90deg, #6a11cb, #d81bff);
            transform: translateY(-1px);
        }

        /* Mobile */

        @media (max-width: 700px) {

            .container {
                width: 90%;
                padding: 25px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

            header {
                padding: 18px 25px;
            }

            nav {
                float: none;
                margin-top: 15px;
            }

            nav a {
                margin-left: 0;
                margin-right: 15px;
            }

        }

    </style>

</head>


<body>


<!-- Header -->

<header>

    <h2>Job Portal</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#">Jobs</a>
        <a href="#">About</a>
        <a href="register.html">Register</a>
    </nav>

</header>


<!-- Registration Form -->

<div class="container">

    <h1>Job Seeker Registration</h1>


    <form action="validate.php" method="post">


        <!-- ROW 1 -->

        <div class="row">

            <div class="column">

                <label>First Name</label>

                <input
                    type="text"
                    name="firstName"
                    placeholder="Enter your first name"
                    required>

            </div>


            <div class="column">

                <label>Last Name</label>

                <input
                    type="text"
                    name="lastName"
                    placeholder="Enter your last name"
                    required>

            </div>

        </div>


        <!-- ROW 2 -->

        <div class="row">

            <div class="column">

                <label>Email</label>

                <input
                    type="text"
                    name="email"
                    placeholder="Enter your email address"
                    required>

            </div>


            <div class="column">

                <label>Phone Number</label>

                <input
                    type="text"
                    name="phone"
                    placeholder="91XXXXXXXX or 21XXXXXXXX"
                    maxlength="10"
                    required>

            </div>

        </div>


        <!-- ROW 3 -->

        <div class="row">

            <div class="column">

                <label>Gender</label>

                <select name="gender" required>

                    <option value="">
                        -- Select Gender --
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="column">

                <label>Preferred Job Category</label>

                <select name="jobCategory" required>

                    <option value="">
                        -- Select Job Category --
                    </option>

                    <option value="Software Developer">
                        Software Developer
                    </option>

                    <option value="Web Developer">
                        Web Developer
                    </option>

                    <option value="Data Analyst">
                        Data Analyst
                    </option>

                    <option value="UI/UX Designer">
                        UI/UX Designer
                    </option>

                    <option value="Tester">
                        Tester
                    </option>

                </select>

            </div>

        </div>


        <!-- ROW 4 -->

        <div class="row">

            <div class="column">

                <label>Skills</label>

                <select name="skills" required>

                    <option value="">
                        -- Select Skill --
                    </option>

                    <option value="HTML & CSS">
                        HTML & CSS
                    </option>

                    <option value="JavaScript">
                        JavaScript
                    </option>

                    <option value="Java">
                        Java
                    </option>

                    <option value="Python">
                        Python
                    </option>

                    <option value="PHP">
                        PHP
                    </option>

                    <option value="MySQL">
                        MySQL
                    </option>

                    <option value="React">
                        React
                    </option>

                </select>

            </div>


            <div class="column">

                <label>Credit Card Number</label>

                <input
                    type="text"
                    name="creditCard"
                    placeholder="Enter 16 digit card number"
                    maxlength="16"
                    required>

            </div>

        </div>


        <!-- ROW 5 -->

        <div class="row">

            <div class="column">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <div class="column">

                <!-- Empty -->

            </div>

        </div>


        <!-- REGISTER BUTTON -->

        <button type="submit">
            Register
        </button>


    </form>

</div>


</body>

</html>
