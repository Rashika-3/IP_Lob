<!DOCTYPE html>
<html><head><title>Job Seeker Registration</title><style>
body{margin:0;
font-family:Arial,sans-serif;
background:AliceBlue;}
.header{background:DarkBlue;
color:white;
text-align:center;
padding:18px;
font-size:28px;
font-weight:bold;}
.container{width:750px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px gray;}
.row{display:flex;
gap:20px;}
.box{flex:1;}
label{display:block;
margin-top:12px;
font-weight:bold;
color:DarkSlateGray;}
input,select{width:100%;
padding:10px;
margin-top:5px;
border:1px solid LightGray;
border-radius:5px;
box-sizing:border-box;}
.error{color:red;
font-size:13px;}
.buttons{text-align:center;}
button{margin-top:20px;
padding:10px 20px;
background:RoyalBlue;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;}
button:hover{background:DodgerBlue;}
#success{color:green;
text-align:center;
font-weight:bold;
margin-top:15px;}
</style></head><body><div class="header">
JOB SEEKER REGISTRATION</div><div class="container">
<form id="form"><div class="row"><div class="box">
<label>First Name</label>
<input type="text" id="fname" placeholder="Enter Your First Name">
<div class="error" id="fnameError"></div></div><div class="box">
<label>Last Name</label><input type="text" id="lname" placeholder="Enter Your Last Name">
<div class="error" id="lnameError"></div></div></div>
<div class="row"><div class="box"><label>Email</label>
<input type="email" id="email" placeholder="Enter Your Email">
<div class="error" id="emailError"></div>
</div><div class="box"><label>Phone Number</label>
<input type="text" id="phone" placeholder="Enter Your Phone Number">
<div class="error" id="phoneError"></div></div></div><div class="row">
<div class="box"><label>Password</label>
<input type="password" id="password" placeholder="Enter Your Password">
<div class="error" id="passwordError"></div></div><div class="box">
<label>Date of Birth</label><input type="date" id="dob">
<div class="error" id="dobError"></div></div></div>
<div class="row"><div class="box"><label>Gender</label>
<select id="gender"><option value="">--Select Gender--</option>
<option>Male</option><option>Female</option></select>
<div class="error" id="genderError"></div></div>
<div class="box"><label>State Name</label><select id="state">
<option value="">--Select State--</option>
<option>Tamil Nadu</option><option>Kerala</option>
<option>Karnataka</option></select>
<div class="error" id="stateError"></div></div></div>
<div class="row"><div class="box">
<label>District Name</label><select id="district">
<option value="">--Select District--</option>
<option>Chennai</option><option>Coimbatore</option>
<option>Dindigul</option><option>Erode</option>
<option>Madurai</option><option>Salem</option>
<option>Thanjavur</option><option>Tirunelveli</option>
<option>Trichy</option><option>Virudhunagar</option>
</select><div class="error" id="districtError"></div>
</div><div class="box"><label>Desired Job Title</label>
<select id="job"><option value="">--Select Job--</option>
<option>Software Developer</option><option>Web Developer</option>
<option>Java Developer</option><option>Python Developer</option>
<option>Data Analyst</option><option>UI/UX Designer</option>
<option>Tester</option></select>
<div class="error" id="jobError"></div></div></div>
<div class="row"><div class="box">
<label>LinkedIn Profile</label>
<input type="text" id="linkedin" placeholder="Enter LinkedIn Profile Link">
<div class="error" id="linkedinError"></div></div><div class="box">
<label>Upload Resume</label><input type="file" id="resume">
<div class="error" id="resumeError"></div>
</div></div><div class="buttons"><button type="submit">Register</button>
<button type="reset">Clear</button><a href="home.html">
<button type="button">Back To Home</button></a></div>
<div id="success"></div></form></div><script>
document.getElementById("form").onsubmit=function(e){e.preventDefault();
document.querySelectorAll(".error").forEach(function(x){x.innerHTML="";});
success.innerHTML="";let valid=true;
if(fname.value==""){fnameError.innerHTML="Enter First Name";
valid=false;}if(lname.value==""){lnameError.innerHTML="Enter Last Name";
valid=false;}let emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
if(!emailPattern.test(email.value)){emailError.innerHTML="Enter Valid Email";
valid=false;}if(!/^[0-9]{10}$/.test(phone.value)){
phoneError.innerHTML="Enter 10 Digit Phone Number";
valid=false;}if(password.value.length<6){
passwordError.innerHTML="Minimum 6 Characters";
valid=false;}if(dob.value==""){dobError.innerHTML="Select Date of Birth";
valid=false;}if(gender.value==""){
genderError.innerHTML="Select Gender";
valid=false;}if(state.value==""){stateError.innerHTML="Select State";
valid=false;}if(district.value==""){
districtError.innerHTML="Select District";
valid=false;}if(job.value==""){
jobError.innerHTML="Select Job Title";
valid=false;}if(linkedin.value==""){
linkedinError.innerHTML="Enter LinkedIn Link";
valid=false;}if(resume.value==""){
resumeError.innerHTML="Upload Resume";
valid=false;}if(valid){
success.innerHTML="Registration Successful!";
document.getElementById("form").reset();}}
</script></body></html>
